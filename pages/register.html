<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your LensFind account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/lensfind-favicon.svg">
</head>
<body class="min-h-screen bg-gray-50 dark:bg-[#111827]">
  <header class="border-b border-gray-200 bg-white dark:border-white/10 dark:bg-[#111827]"><div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-5"><a href="../index.html" class="flex items-center gap-3"><span class="lensfind-logo-mark"><i class="fa-solid fa-camera-retro"></i></span><span class="font-extrabold text-gray-900 dark:text-white">Lens<span class="text-amber-500">Find</span></span></a><div class="flex gap-2"><button id="direction-toggle" class="rounded-lg border border-gray-200 px-3 text-gray-700 dark:border-white/15 dark:text-white"><i id="direction-icon" class="fa-solid fa-arrow-right-arrow-left"></i></button><button id="theme-toggle" class="rounded-lg border border-gray-200 px-3 text-gray-700 dark:border-white/15 dark:text-white"><i id="theme-icon" class="fa-solid fa-moon"></i></button></div></div></header>
  <main class="grid min-h-[calc(100vh-72px)] place-items-center px-5 py-12"><section class="w-full max-w-md rounded-3xl bg-white p-7 shadow-xl shadow-gray-200/50 dark:bg-white/5 dark:shadow-none sm:p-9"><p class="text-sm font-semibold text-amber-500">JOIN LENSFIND</p><h1 class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">Create your account</h1><p class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300">Save inspiration, contact creatives, and keep your projects organised.</p><form class="mt-7 space-y-4" onsubmit="event.preventDefault(); alert('Your account is ready to set up.');"><input required aria-label="Full name" placeholder="Full name" class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-white/15 dark:bg-white/5 dark:text-white"><input required type="email" aria-label="Email address" placeholder="Email address" class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-white/15 dark:bg-white/5 dark:text-white"><input required type="password" aria-label="Password" placeholder="Create a password" class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-white/15 dark:bg-white/5 dark:text-white"><button class="w-full rounded-xl bg-amber-500 px-4 py-3 font-semibold text-white hover:bg-amber-600">Create account</button></form><p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-300">Already have an account? <a href="login.html" class="font-semibold text-amber-500 hover:text-amber-600">Log in</a></p></section></main>


<script src="../assets/js/script.js"></script>

</body></html>
